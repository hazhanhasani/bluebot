name: BlueBot CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bluebot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, zip, gd, dom, simplexml, xmlwriter, xmlreader, fileinfo, iconv, bcmath, pdo_mysql
          tools: composer

      - name: Validate Composer metadata
        run: composer validate --no-interaction --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Lint PHP sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './storage/*' \
            -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found."
            exit 1
          fi
          printf 'Linting %s PHP files...\n' "${#files[@]}"
          for file in "${files[@]}"; do
            php -l "$file" >/dev/null
          done
          echo "PHP syntax OK."

      - name: Panel API compatibility contracts
        run: php tests/panel_compat_contract.php

      - name: Project structure contract
        run: php tests/project_structure_contract.php

      - name: Telegram Mini App contract
        run: php tests/telegram_miniapp_contract.php

      - name: Service selection contract
        run: php tests/service_selection_contract.php

      - name: Product panel scope contract
        run: php tests/product_panel_scope_contract.php

      - name: Telegram Mini App bootstrap tests
        run: node tests/telegram_bootstrap_test.js

      - name: In-bot updater contracts
        run: php tests/inbot_updater_contract.php

      - name: Installed build version tests
        run: php tests/installed_build_version_test.php

      - name: Trusted proxy webhook tests
        run: php tests/trusted_proxy_test.php

      - name: Runtime bot identity tests
        run: php tests/runtime_identity_test.php

      - name: Validate update worker syntax
        run: bash -n scripts/bluebot-update-worker.sh

      - name: Lint panel JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in panel/js/*.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done

      - name: Verify BlueBot UI contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '[data-theme=bluebot]' panel/css/style.css
          grep -Fq "'bluebot' =>" panel/settings.php
          grep -Fq "localStorage.getItem('panel-theme') || 'bluebot'" panel/inc/layout_head.php
          grep -Fq '<title>BlueBot Web App</title>' app/index.php

      - name: Verify panel page integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Fc "include __DIR__ . '/inc/layout_foot.php'" panel/payment.php)" -eq 1
          payment_last="$(awk 'NF { line=$0 } END { print line }' panel/payment.php)"
          test "$payment_last" = "<?php include __DIR__ . '/inc/layout_foot.php'; ?>"

          test "$(grep -Fc "include __DIR__ . '/inc/layout_foot.php'" panel/index.php)" -eq 1
          dashboard_last="$(awk 'NF { line=$0 } END { print line }' panel/index.php)"
          test "$dashboard_last" = "<?php include __DIR__ . '/inc/layout_foot.php'; ?>"

          echo "Panel page integrity OK."

      - name: Verify BlueBot safety contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f src/Support/Logger.php
          test -f src/Support/Diagnostics.php
          test -f src/Support/InstallerGuard.php
          test -f src/Payment/PaymentState.php
          test -f panel/diagnostics.php
          test -f panel/audit.php
          grep -Fq "delivery_reviewed" src/Payment/PaymentState.php
          grep -Fq "NOT IN ('paid', 'delivery_error', 'delivery_reviewed')" src/Payment/PaymentState.php
          php -r '$s=file_get_contents("src/Payment/PaymentState.php"); $a=strpos($s,"function markPaymentDeliveryReviewed"); $b=strpos($s,"payment.delivery_reviewed"); if ($a===false || $b===false || $b<$a) exit(1);'
          grep -Fq "review_delivery" panel/payment.php
          grep -Fq "csrf_check_post();" panel/payment.php
          grep -Fq "CURLPROTO_HTTP | CURLPROTO_HTTPS" request.php
          grep -Fq "BLUEBOT_VERIFY_PANEL_TLS" request.php
          grep -Fq "bluebotBuildDebugReport" admin.php
          grep -Fq "bluebotCollectDiagnostics" panel/diagnostics.php
          grep -Fq "bluebotCollectDiagnostics" panel/index.php
          grep -Fq "Dashboard health check failed" panel/index.php
          grep -Fq "bluebotAuditLogPath" src/Support/Logger.php
          grep -Fq "bluebotReadAuditLog" panel/audit.php
          grep -Fq "admin.audit_export" panel/audit.php
          grep -Fq "Content-Type: text/csv" panel/audit.php
          grep -Fq "auditSearchPlaceholder" panel/audit.php
          grep -Fq "admin.payment_delivery_review" panel/payment.php
          grep -Fq "bluebotRedactLogValue" api/utils.php
          grep -Fq "admin.login_success" panel/login.php
          grep -Fq "admin.logout" panel/logout.php
          grep -Fq "api_token_configured" src/Support/Diagnostics.php
          grep -Fq "webhook_protected" src/Support/Diagnostics.php
          grep -Fq "bluebotRecordHealthSnapshot" src/Support/Diagnostics.php
          grep -Fq "bluebotUpdateCurrentVersion" src/Support/Diagnostics.php
          grep -Fq "require_once __DIR__ . '/UpdateManager.php';" src/Support/Diagnostics.php
          grep -Fq "bluebotReadHealthHistory" panel/diagnostics.php
          test "$(grep -Fc 'bluebotRecordHealthSnapshot($diagnostics)' panel/diagnostics.php)" -eq 1
          test "$(grep -Fc 'bluebotReadHealthHistory' panel/diagnostics.php)" -eq 1
          grep -Fq "bluebot_qr" function.php
          grep -Fq "require_once __DIR__ . '/config.php';" function.php
          grep -Fq "require_once __DIR__ . '/src/Support/InstallerGuard.php';" function.php
          grep -Fq "function bluebotEnsureInstallerRemoved" src/Support/InstallerGuard.php
          grep -Fq "function mirzaEnsureInstallerRemoved" src/Support/InstallerGuard.php
          test "$(grep -Fc 'function bluebotEnsureInstallerRemoved' function.php)" -eq 0
          echo "BlueBot safety contracts OK."

      - name: Verify diagnostics history round-trip
        shell: bash
        run: |
          set -euo pipefail
          php -r 'require "src/Support/Diagnostics.php"; $d=["database_ok"=>true,"storage_writable"=>true,"vendor_ready"=>true,"installer_removed"=>true,"webhook_protected"=>true,"api_token_configured"=>true,"delivery_errors"=>0,"delivery_reviewed"=>1,"version"=>"ci-a","mini_version"=>"ci","php_version"=>PHP_VERSION,"free_disk"=>"1 GB","bot_status"=>"active"]; if (!bluebotRecordHealthSnapshot($d)) exit(1); $d["version"]="ci-b"; if (!bluebotRecordHealthSnapshot($d)) exit(2); $h=bluebotReadHealthHistory(2); if (count($h)!==2 || $h[0]["version"]!=="ci-b" || $h[1]["version"]!=="ci-a" || !$h[0]["overall_healthy"]) exit(3);'
          rm -f storage/logs/health.jsonl storage/logs/health.jsonl.1
          echo "Diagnostics history/version-change round-trip OK."

      - name: Verify installer guard module
        shell: bash
        run: |
          set -euo pipefail
          php -r 'require "src/Support/InstallerGuard.php"; $d=sys_get_temp_dir()."/bluebot-installer-ci-".bin2hex(random_bytes(4)); mkdir($d,0700); file_put_contents($d."/probe","ok"); if (!bluebotRemoveInstallerPath($d) || file_exists($d)) exit(1);'
          echo "Installer guard module OK."

      - name: Verify AqayePardakht callback contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "Payment_Method'] ?? '') !== 'aqayepardakht'" payment/aqayepardakht.php
          grep -Fq "CURLOPT_CONNECTTIMEOUT_MS" payment/aqayepardakht.php
          grep -Fq "AqayePardakht verification request failed" payment/aqayepardakht.php
          grep -Fq "statusDeliveryFailed" payment/aqayepardakht.php
          grep -Fq "deliveryFailed" payment/aqayepardakht.php
          echo "AqayePardakht callback contract OK."

      - name: Blupal payment contract
        run: php tests/blupal_payment_contract.php

      - name: Validate installer syntax
        run: bash -n install.sh

      - name: Check config template safety
        shell: bash
        run: |
          set -euo pipefail
          grep -q "{API_KEY}" config.php
          grep -q "{password_db}" config.php
          grep -q "{domain_name}" config.php
          echo "Config template placeholders are intact."
