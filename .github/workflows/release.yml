name: BlueBot stable release

on:
  push:
    branches:
      - main
    paths:
      - version
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build the hosting bundle for
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve stable version
        id: version
        shell: bash
        env:
          DISPATCH_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          set -euo pipefail

          FILE_VERSION="$(tr -d '[:space:]' < version)"
          if ! [[ "$FILE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable version in version file: $FILE_VERSION" >&2
            exit 1
          fi

          if [ -n "$DISPATCH_TAG" ]; then
            TAG="$DISPATCH_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$FILE_VERSION"
          fi

          NORMALIZED="${TAG#v}"
          NORMALIZED="${NORMALIZED#V}"
          if [ "$NORMALIZED" != "$FILE_VERSION" ]; then
            echo "Tag $TAG does not match version file $FILE_VERSION" >&2
            exit 1
          fi

          echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure stable tag exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; reusing it."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "BlueBot ${TAG#v} stable"
          git push origin "$TAG"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, zip, gd, dom, simplexml, xmlwriter, xmlreader, fileinfo, iconv, bcmath
          tools: composer

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader --classmap-authoritative

      - name: Verify release version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$(tr -d '[:space:]' < version)" = "$VERSION"
          test -f vendor/autoload.php

      - name: Build hosting bundle
        id: bundle
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          FILE="bluebot-host-${TAG}.zip"
          zip -r -q "../${FILE}" . \
            -x '.git/*' '.github/*' 'graphify-out/*' '.gitignore' 'install.sh'
          mv "../${FILE}" .
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"
          unzip -l "${FILE}" | tail -1

      - name: Set up JDK 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6 for Android
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare permanent Android signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BLUE_PANEL_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.BLUE_PANEL_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BLUE_PANEL_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_B64" || { echo "Missing BLUE_PANEL_ANDROID_KEYSTORE_B64" >&2; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing BLUE_PANEL_ANDROID_KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing BLUE_PANEL_ANDROID_KEY_PASSWORD" >&2; exit 1; }

          KEYSTORE_PATH="$RUNNER_TEMP/blue-panel-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          EXPECTED="B45B0E46B1AF8A74EC6D4322C3D29FCD6130915D1F66EB83C7D72CAE29441204"
          ACTUAL="$(keytool -list -v             -keystore "$KEYSTORE_PATH"             -storepass "$STORE_PASSWORD"             -alias blue-panel-release             | awk -F': ' '/SHA256:/{gsub(":","",$2); print toupper($2); exit}')"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Unexpected Blue Panel signing certificate: $ACTUAL" >&2
            exit 1
          fi

          echo "BLUE_PANEL_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed Android release APK
        env:
          BLUE_PANEL_KEYSTORE_PASSWORD: ${{ secrets.BLUE_PANEL_ANDROID_KEYSTORE_PASSWORD }}
          BLUE_PANEL_KEY_PASSWORD: ${{ secrets.BLUE_PANEL_ANDROID_KEY_PASSWORD }}
        run: gradle -p android-client :app:assembleRelease --stacktrace

      - name: Prepare and verify Android release asset
        id: android
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          SOURCE="android-client/app/build/outputs/apk/release/app-release.apk"
          test -f "$SOURCE"

          APK="blue-panel-android-${TAG}.apk"
          cp "$SOURCE" "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          EXPECTED="B45B0E46B1AF8A74EC6D4322C3D29FCD6130915D1F66EB83C7D72CAE29441204"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK"             | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{gsub(":","",$2); print toupper($2); exit}')"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Published APK certificate mismatch: $ACTUAL" >&2
            exit 1
          fi

          echo "file=${APK}" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"

      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          FILE: ${{ steps.bundle.outputs.file }}
          APK: ${{ steps.android.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "BlueBot $VERSION" \
              --latest
          else
            gh release create "$TAG" \
              --title "BlueBot $VERSION" \
              --generate-notes \
              --latest
          fi

          gh release upload "$TAG" "$FILE" "$APK" --clobber
