name: Android Client

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'release/**'
    paths:
      - 'android-client/**'
      - '.github/workflows/android-client.yml'
  pull_request:
    paths:
      - 'android-client/**'
      - '.github/workflows/android-client.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Test, lint and build debug APK
        run: gradle -p android-client :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blue-vpn-android-debug-${{ github.sha }}
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


  build-signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect permanent signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ] \
            && [ -n "${KEYSTORE_PASSWORD:-}" ] \
            && [ -n "${KEY_ALIAS:-}" ] \
            && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Permanent Android signing secrets are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Permanent Android signing secrets are not configured yet."
          fi

      - name: Set up JDK 17
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        if: steps.signing.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore permanent signing keystore
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/blue-vpn-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        run: gradle -p android-client :app:assembleRelease --stacktrace

      - name: Verify signing certificate
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          EXPECTED_CERT_SHA256: 5ac901356db4f79be2cbf577e37439a0414c881da200b423a59f26f9eb4e9acc
        run: |
          set -euo pipefail
          APK="android-client/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT"
          CERT_SHA256="$(printf '%s\n' "$CERT_OUTPUT" |
            sed -n -E 's/^(Signer #1|V[0-9.]+ Signer): certificate SHA-256 digest: //p' |
            head -n 1 |
            tr '[:upper:]' '[:lower:]' |
            tr -d ':[:space:]')"
          test "$CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" <<<"$CERT_OUTPUT"
          grep -Fq "Verified using v3 scheme (APK Signature Scheme v3): true" <<<"$CERT_OUTPUT"

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blue-vpn-android-signed-${{ github.sha }}
          path: android-client/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
