name: Android Client

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'android-client/**'
      - '.github/workflows/android-client.yml'
  pull_request:
    paths:
      - 'android-client/**'
      - '.github/workflows/android-client.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle -p android-client :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blue-panel-android-debug-${{ github.sha }}
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
